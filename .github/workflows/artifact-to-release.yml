name: artifact-to-release

# Copies an already-built artifact into a DRAFT release (private to collaborators).
# No rebuild and no text-to-speech: it only moves existing files.
on:
  push:
    paths:
      - "pipeline/release.json"
  workflow_dispatch:
    inputs:
      run_id:
        description: "build-video run id that produced the artifact"
        required: false
      artifact:
        description: "artifact name, e.g. E-F01-rev1"
        required: false

permissions:
  contents: write
  actions: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          python3 - <<'PY'
          import json, os
          r = json.load(open("pipeline/release.json"))
          i = "${{ inputs.run_id }}" or str(r["run_id"])
          a = "${{ inputs.artifact }}" or r["artifact"]
          open(os.environ["GITHUB_OUTPUT"], "a").write(f"run_id={i}\nartifact={a}\n")
          PY
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.p.outputs.artifact }}
          run-id: ${{ steps.p.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: files
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la files
          tag="media-${{ steps.p.outputs.artifact }}"
          gh release create "$tag" --draft --title "$tag" --notes "Built media (private draft). Not published." -R "$GITHUB_REPOSITORY" || true
          find files -maxdepth 2 -type f \( -name '*.mp4' -o -name '*.srt' -o -name '*.vtt' -o -name '*.json' -o -name 'contact-sheet.png' \) -print0 | xargs -0 gh release upload "$tag" --clobber -R "$GITHUB_REPOSITORY"
