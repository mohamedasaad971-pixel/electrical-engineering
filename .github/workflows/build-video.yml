name: build-video

on:
  push:
    paths:
      - "pipeline/run.json"
  workflow_dispatch:

permissions:
  contents: write   # only needed for the optional draft release upload

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      rev: ${{ steps.m.outputs.rev }}
      synthesize: ${{ steps.m.outputs.synthesize }}
      burn: ${{ steps.m.outputs.burn }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          python3 - <<'PY'
          import json, os
          r = json.load(open("pipeline/run.json", encoding="utf-8"))
          if r.get("action", "build") != "build":
              raise SystemExit("run.json action must be 'build'")
          vids = r.get("video", [])
          if not 1 <= len(vids) <= 4:
              raise SystemExit("run.json: 1 to 4 videos required (got %d)" % len(vids))
          inc = [{"idx": i, "script": v, "name": os.path.basename(v)[:-5]} for i, v in enumerate(vids)]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": inc}) + "\n")
              f.write("rev=%d\n" % int(r.get("rev", 1)))
              f.write("synthesize=%s\n" % str(bool(r.get("synthesize", True))).lower())
              f.write("burn=%s\n" % str(bool(r.get("burn", True))).lower())
          PY

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: System packages (ffmpeg, fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core fonts-noto-extra fontconfig
          fc-cache -f
          fc-match "Noto Sans Arabic"; fc-match "Noto Serif Display"; fc-match "Noto Sans"
      - name: Python deps and Chromium
        run: |
          pip install -r pipeline/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Validate script
        run: python tools/validate.py "${{ matrix.script }}"
      - name: Restore voice cache
        uses: actions/cache@v4
        with:
          path: cache/tts
          key: tts-${{ github.run_id }}-${{ matrix.idx }}
          restore-keys: |
            tts-
      - name: Build
        env:
          VIDEO_INDEX: ${{ matrix.idx }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_COMMERCIAL: ${{ vars.ELEVENLABS_COMMERCIAL }}
        run: python pipeline/build_video.py
      - name: Audio check (Whisper, synthesized builds only)
        continue-on-error: true
        env:
          VIDEO_INDEX: ${{ matrix.idx }}
        run: python pipeline/audio_check.py
      - name: Summary
        run: |
          for r in out/*/report.json; do python3 -c "import json,sys;r=json.load(open(sys.argv[1]));print('###',r['video']);print(json.dumps(r['qa'],ensure_ascii=False,indent=1));print('warnings:',r['warnings'])" "$r"; done | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Video id
        id: vid
        run: echo "id=$(ls out | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vid.outputs.id }}-rev${{ needs.plan.outputs.rev }}
          path: out/${{ steps.vid.outputs.id }}
          retention-days: 30
      - name: Draft release (optional)
        if: ${{ vars.RELEASE_UPLOAD == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ steps.vid.outputs.id }}-rev${{ needs.plan.outputs.rev }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "$tag" --notes "Automated build (media not committed to git)."
          find out/${{ steps.vid.outputs.id }} -maxdepth 2 -type f \( -name '*.mp4' -o -name '*.srt' -o -name '*.vtt' -o -name '*.json' -o -name 'contact-sheet.png' \) -print0 | xargs -0 gh release upload "$tag" --clobber
